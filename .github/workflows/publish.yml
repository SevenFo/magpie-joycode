name: JoyCode release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: npm test
      - run: bun test packages/joycode
      - run: node --check packages/joycode/index.mjs
      - run: npm pack --dry-run
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version and pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if ("v"+require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "JoyCode for Magpie $GITHUB_REF_NAME"
